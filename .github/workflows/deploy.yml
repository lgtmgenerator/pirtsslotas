name: Build and deploy to Hostnet cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: https://cpanel-9.hostnet.lv:2083
      CPANEL_USER: jdacom
      REPO_ROOT: /home2/jdacom/repos/pirtsslotas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Publish build output to the deploy branch
        run: |
          cd dist
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" deploy

      - name: Pull the deploy branch into the cPanel clone
        run: |
          curl -sS --fail -H "Authorization: cpanel $CPANEL_USER:${{ secrets.CPANEL_TOKEN }}" \
            "$CPANEL_HOST/execute/VersionControl/update?repository_root=$REPO_ROOT&branch=deploy" | tee update.json
          grep -q '"status":1' update.json

      - name: Run .cpanel.yml deployment
        run: |
          sleep 10
          curl -sS --fail -H "Authorization: cpanel $CPANEL_USER:${{ secrets.CPANEL_TOKEN }}" \
            "$CPANEL_HOST/execute/VersionControlDeployment/create?repository_root=$REPO_ROOT" | tee deploy.json
          grep -q '"status":1' deploy.json
